name: Update Schema.org

on:
  workflow_dispatch:
    inputs:
      version:
        description: Schema.org version in v<major>.<minor> form
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: schema-org-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    name: Update Schema.org
    steps:
      - name: Validate dispatch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || { echo "Schema updates must run from main" >&2; exit 1; }
          [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+$ ]] || { echo "expected schema version v<major>.<minor>" >&2; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --locked
      - name: Generate schema artifacts
        id: update
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          changed="$(uv run python -c 'import os; from schema_org_codegen.updater import SchemaUpdater; print("true" if SchemaUpdater().update(os.environ["VERSION"]) else "false")')"
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
      - name: Validate generated artifacts
        if: steps.update.outputs.changed == 'true'
        run: uv run python -m pytest
      - name: Check generated drift
        if: steps.update.outputs.changed == 'true'
        run: uv run python -m schema_org_codegen.check
      - name: Run Ruff
        if: steps.update.outputs.changed == 'true'
        run: uv run ruff check .
      - name: Run ty
        if: steps.update.outputs.changed == 'true'
        run: uv run ty check
      - name: Check generated scope
        id: scope
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          allowed() {
            case "$1" in
              codegen/data/schema.ttl|codegen/generated_manifest.json|src/schema_org/__init__.py|src/schema_org/datatypes.py|src/schema_org/enums.py|src/schema_org/registry.py|src/schema_org/schema_version.py|src/schema_org/py.typed|src/schema_org/models/*) return 0 ;;
              *) return 1 ;;
            esac
          }
          changed=0
          while IFS= read -r line; do
            [[ -n "$line" ]] || continue
            path="${line:3}"
            if [[ "$path" == *" -> "* ]]; then
              path="${path##* -> }"
            fi
            allowed "$path" || { echo "Disallowed change: $path" >&2; exit 1; }
            changed=1
          done < <(git status --porcelain=v1)
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          if [[ "$changed" == 0 ]]; then
            echo "No schema changes for ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Create update pull request
        if: steps.scope.outputs.changed == '1'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/schema-org-${{ inputs.version }}
          delete-branch: true
          title: "schema: update to ${{ inputs.version }}"
          commit-message: "schema: update to ${{ inputs.version }}"
          body: "Generated Schema.org snapshot and artifacts await PR gate."
          add-paths: |
            codegen/data/schema.ttl
            codegen/generated_manifest.json
            src/schema_org/__init__.py
            src/schema_org/datatypes.py
            src/schema_org/enums.py
            src/schema_org/registry.py
            src/schema_org/schema_version.py
            src/schema_org/py.typed
            src/schema_org/models/__init__.py
            src/schema_org/models/*.py
