name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run python -m pytest
      - run: uv run python -m schema_org_codegen.check
      - run: uv run python -m build
      - name: Check archive contents
        if: matrix.python-version == '3.12'
        run: |
          uv run python -c 'import glob, tarfile, zipfile; forbidden = lambda name: ("/codegen/" in "/" + name or "/tests/" in "/" + name or name.endswith(".ttl") or "templates" in name); wheel = zipfile.ZipFile(glob.glob("dist/*.whl")).namelist(); source = tarfile.open(glob.glob("dist/*.tar.gz")).getnames(); assert not any(forbidden(name) for name in wheel + source); assert any(name.endswith("py.typed") for name in wheel)'
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: distributions
          path: dist/

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
