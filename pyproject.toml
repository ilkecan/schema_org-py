[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "schema_org-py"
version = "0.1.0"
description = "Generated Schema.org models with strict validation and JSON-LD serialization"
keywords = ["schema.org", "json-ld", "pydantic", "structured data"]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND CC-BY-SA-3.0"
license-files = ["LICENSE.txt", "LICENSE-SCHEMA-ORG.txt"]
authors = [
  { name = "İlkecan Bozdoğan", email = "ilkecan@protonmail.com" },
]
dependencies = [
  "pydantic>=2.9,<3",
  "typing-extensions>=4.12",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Framework :: Pydantic",
  "Framework :: Pydantic :: 2",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ilkecan/schema_org-py"
Documentation = "https://github.com/ilkecan/schema_org-py#readme"
Changelog = "https://github.com/ilkecan/schema_org-py/blob/main/CHANGELOG.md"
Issues = "https://github.com/ilkecan/schema_org-py/issues"
Source = "https://github.com/ilkecan/schema_org-py"

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "hatchling>=1.27,<2",
  "pytest>=8.3,<10",
  "rdflib>=7.1,<8",
  "ruff>=0.16.5,<0.17",
  "ty>=0.0.77,<0.1",
]

[tool.hatch.build]
dev-mode-dirs = ["src", "codegen"]

[tool.hatch.build.targets.wheel]
packages = ["src/schema_org"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/schema_org",
  "/LICENSE.txt",
  "/LICENSE-SCHEMA-ORG.txt",
  "/README.md",
  "/CHANGELOG.md",
  "/pyproject.toml",
  "/build_hooks.py",
]
ignore-vcs = true

[tool.hatch.build.targets.sdist.hooks.custom]
path = "build_hooks.py"



[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/schema_org/models/*.py" = ["RUF001"]
"src/schema_org/registry.py" = ["RUF001"]

[tool.ty.environment]
python-version = "3.10"
root = ["src", "codegen"]

[tool.ty.src]
include = ["src", "codegen", "tests", "build_hooks.py"]

[[tool.ty.overrides]]
include = ["src/schema_org/models/*.py"]

[tool.ty.overrides.rules]
invalid-assignment = "ignore"
[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src", "codegen"]
testpaths = ["tests"]
